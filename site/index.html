<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14233b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15243a" media="(prefers-color-scheme: dark)">
<title>Weekly Board</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="head">
    <h1>Weekly Board</h1>
    <a class="refresh" href="https://github.com/ccronan27/weekly-board/actions/workflows/refresh.yml" target="_blank" rel="noopener noreferrer" title="Opens GitHub. Tap Run workflow and new data shows up in a few minutes.">Refresh</a>
  </div>
  <p id="stamp" class="muted">Loading</p>
  <p id="next" class="muted" hidden></p>
</header>
<div class="bar">
  <nav id="tabs" class="tabs" role="tablist" aria-label="Leagues"></nav>
  <div id="viewbar"></div>
</div>
<main id="panel" role="tabpanel" aria-live="polite"></main>
<footer class="foot muted">
  <p>Projection is the equal average of ESPN and Rotowire, scored with each league's rules. Floor and ceiling are one weekly standard deviation from the projection. Vegas lines are context only. All times are Central.</p>
</footer>
<noscript><p class="error">This page needs JavaScript.</p></noscript>
<script src="app.js"></script>
</body>
</html>
